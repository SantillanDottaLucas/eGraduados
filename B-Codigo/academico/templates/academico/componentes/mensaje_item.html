<div class="alert alert-{{ tipo }} alert-dismissible fade show d-flex align-items-start gap-2"
     role="alert">
    <i class="bi {{ icono }} mt-1" aria-hidden="true"></i>
    <span class="flex-grow-1">{{ mensaje }}</span>
    <button type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Cerrar mensaje"></button>
</div>
